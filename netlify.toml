# Configuration Netlify pour Coumao
# - Le site (HTML/CSS/JS) est servi depuis la racine du dépôt
# - Le "moteur de paiement" est dans netlify/functions/

[build]
  publish = "."
  functions = "netlify/functions"

# Node récent (fetch intégré) pour la fonction de paiement
[functions]
  node_bundler = "esbuild"
